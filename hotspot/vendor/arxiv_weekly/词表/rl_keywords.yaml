# RL 相关性词表
#
# 这个文件是**给你调的**，不是给程序调的。改完跑：
#     python -m rllib filter --rl
# 即可重新打分，**不需要重新抓取任何数据**——这正是把 rl 存成结构化对象
# （score + reasons）而不是布尔的全部意义。
#
# 判定规则（见 rllib/filters/rl.py）：
#   - 命中任一 strong  → 判定为 RL（除非命中 negative）
#   - 只命中 mid       → 累积分值达到 filter.mid_signal_threshold 才判定
#   - 命中任一 negative → 直接排除，无视其他命中
#
# 调参建议：**先宽后紧**。库的价值在于"不遗漏"，误收几篇非 RL 论文的代价，
# 远小于漏掉一篇重要 RL 工作的代价。打分结果全部留在 jsonl 里可回溯。

