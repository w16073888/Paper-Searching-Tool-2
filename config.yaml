# 移动云杯 · 本地论文库研究方向热点挖掘 —— 唯一配置入口
#
# 只有一套环境，不做接口抽象（方案 §不做清单）。
# ⚠️ 凡标「别改」的值都来自实测踩坑，改了不是调参，是把那几小时重走一遍。

paths:
  # 导师论文库（只读，四道闸）。访问一律走 dasc.readonly.LibraryView。
  library: D:\大学编程学习\obsidian\rl_acdemical_paper
  # dasc 复用源。sys.path 接线在 hotspot/__init__.py，这里只作记录。
  obsidian: D:\大学编程学习\obsidian
  # 产物目录，相对本项目根。可全量重建，不入库。
  workspace: workspace

corpus:
  # 24+25 合并语料（方案 A，2026-09-24）—— 一次性升级后的完整语料源。
  # 并集 22,747 篇（25=13,119 + 24=9,628，paper_id 交集 0），字段同构、跨年口径统一。
  # 读取走 hotspot/corpus.MergedCorpus，只读；`Paper.year` 保留（可分组）。
  # ⚠️ 此后移动云杯的语料来源是这里（取代单一导师库 D 盘 2025 单年）。
  sources:
    - G:\rl_data24\资源\papers.jsonl
    - G:\rl_data\资源\papers.jsonl
  # arXiv 周报连续流（独立源，共享引擎，2026-10-02-规划-接入arXiv周报与发布.md）。
  # venue 恒 "arXiv"；另带 topics(分类) / first_seen(入库日) → 支持「本周新增」。
  # 只读外部库，本工程一个字都不写它。
  arxiv_source: D:\大学编程学习\arXiv周报\数据\papers.jsonl

llm:
  # 统一用移动云 MaaS（key 走环境变量 Mobile_trash_API_KEY，probe 已验证可通；
  # 与 llm_eval 同端点同 key，前端 key 留空即自动生效）。
  base_url: https://zhenze-huhehaote.cmecloud.cn/v1
  model_flash: deepseek-v4-flash-0731   # L3 命名簇 / L5 引用校验
  model_pro: deepseek-v4-flash-0731     # L5 答案生成
  api_key_env: Mobile_trash_API_KEY     # 只读，永不落盘
  timeout: 300
  # ── 成本估算单价（¥ / 每 1M token）——「待核实」以 DeepSeek 官方定价页为准 ──
  cost_per_1m_in: 1.0
  cost_per_1m_out: 2.0
  max_input_chars: 8000         # dasc.llm.client 的「只发摘要」闸；溢出 raise 不截断
  budget:
    max_calls: 2000
    max_tokens: 5000000
    max_usd: null               # 不按钱熔断，按 token

# ── 评测工具用 LLM（大创接入评测，2026-09-30 记录）─────────────
#   独立于上方 `llm:`（主问答）。供 eval 跑真调用，key 只从环境变量读。
#   base_url 不含 /chat/completions（dasc client 会拼）。
llm_eval:
  base_url: https://zhenze-huhehaote.cmecloud.cn/v1
  model: deepseek-v4-flash-0731   # 移动云 MaaS · 呼和浩特区域 deepseek-v4-flash（2026-10-01 换）
  api_key_env: Mobile_trash_API_KEY   # 用户 ADMIN 环境变量名，只读，永不落盘
  timeout: 600                    # openai 单请求超时（秒）—— 该端点慢，dasc 默认 120 不够

embed:
  # ── 以下三个值来自 dasc/cluster/embed.py，**一个都别改** ──
  model: BAAI/bge-m3            # XLM-R-large 568M / 1024 维
  max_seq_length: 1024          # 8k 上限在 CPU 上每篇要几分钟
  batch_size: 4                 # MX330 只有 2 GB 显存，装不下 fp32 的 2.3 GB 权重
  hf_home: D:\hf_cache          # C 盘满会导致 Python 段错误
  # ── 本项目新增：分块续跑（风险 R1 的唯一对策）──
  # dasc 的 embed_pool 一次 savez_compressed 全量落盘，全库 8.5 小时断了全白跑。
  chunk_size: 500               # 每 N 篇落一个分片；已完成分片不重算

topics:
  # 生产趋势快照随代码部署；workspace 中的旧快照只作兼容回退。
  snapshot: hotspot/data/topic_snapshot_v1.json.gz

agent:
  search_limit: 12
  fetch_limit: 6
  max_claims: 6
  request_limit: 10
  tool_limit: 10
  scope_timeout_s: 30
  agent_timeout_s: 150
  verify_timeout_s: 30

spread:
  # ── 跨会扩散三态（方案 §3.2）—— 纯计数，0 token ──
  #   铺开 = 出现在 >= spread_min 个会
  #   新进 = 只出现在 venue_order 末位的会
  #   单会 = 其余
  # ⚠️ 红线：**没有第四态**。语料为 24+25 两年（见方案文件头修订框），
  #    但主口径选择对比跨会、不做跨年 ⇒ 仍不能输出"退潮/下降/衰退"（方案 §1.3）。
  spread_min: 3
  # ⚠️ 探针 6 要实测核实这个序（方案 §8）。序错了整个预测实验垮掉（风险 R8）。
  venue_order: [ICLR, ICML, NeurIPS]
  venue_holdout: NeurIPS        # 跨会留出验证的封存会（方案 §5.4）
  # CoRL 是机器人专会，不属于这条时间轴，另算。
  venue_off_axis: [CoRL]

